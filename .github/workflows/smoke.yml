name: smoke

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # smoke.sh's quick set is ~2 min plus the two cutoff scripts —
    # generous headroom over a cold cache-miss run, well under
    # GitHub's 6h default so a hang fails fast instead of burning
    # the whole job queue.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest (24.04) restricts unprivileged user-namespace
      # creation via AppArmor by default, which is exactly what Nix's
      # build sandbox needs — every build fails at the first
      # derivation with "error: executing '.../bash': No such file or
      # directory" (the sandboxed child can't set up its mount
      # namespace at all, which surfaces as a bogus ENOENT rather than
      # a permissions error). Known, still-open upstream gap:
      # https://github.com/DeterminateSystems/nix-installer-action/issues/193.
      - name: Allow unprivileged user namespaces (Nix sandbox needs this on ubuntu-latest)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v15
        with:
          name: dynamicderivations
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      # go/'s own unit tests (internal/batch, internal/expr,
      # internal/shim, etc.) never ran in CI before this — every one
      # of them was previously only exercised by hand. CGO_ENABLED=0
      # matches this repo's own build convention (ARCHITECTURE.md's
      # "Building the binary" section); nixgg never needs cgo, and
      # enabling it here would require a real system C compiler nix
      # doesn't provide by default.
      - name: Run go vet + go test
        run: |
          cd go
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./...

      # One-time build of the builder-rpc-v0-capable Nix this flake
      # pins (see README.md's "Requirements" section) — substituted
      # from cache.nixos.org, not built from source. --accept-flake-config
      # avoids relying on ambient trust state: CI has no TTY to prompt
      # in, and accept-flake-config defaults to false.
      - name: Build patched-nix
        run: nix build --no-eval-cache --accept-flake-config .#patched-nix -o .patched-nix

      # tests/smoke.sh's own quick set: every example builds, its
      # artifact lands at the FHS path it should, and it runs. Does
      # NOT include EXAMPLES=all's redis/ffmpeg/llvm (too slow for
      # every push/PR) or tests/drv-equivalence.sh (a separate,
      # slower invariant check — see the drv-equivalence job below).
      - name: Run smoke tests
        run: PATCHED_NIX="$PWD/.patched-nix" bash tests/smoke.sh

      # Early-cutoff proofs for both configure-caching mechanisms —
      # these check the CACHING MECHANISM (does an excluded-file edit
      # actually skip a rebuild), which tests/smoke.sh's build+run
      # checks can't catch on their own.
      - name: Run configure-cache-cutoff tests
        run: PATCHED_NIX="$PWD/.patched-nix" bash tests/configure-cache-cutoff.sh

      - name: Run dyndrv-configure-cache-cutoff test
        run: PATCHED_NIX="$PWD/.patched-nix" bash tests/dyndrv-configure-cache-cutoff.sh

      # Turns the README's one-off, by-hand openssl measurement
      # ("2/2213 TUs rebuild on a one-file patch") into an automated
      # count on a cheap fixture (lua, 34 TUs): edit one .c file,
      # assert exactly its own TU recompiles and every other TU stays
      # a cache hit. configure-cache-cutoff.sh/dyndrv-*'s cutoff checks
      # can't catch a regression that widens the invalidation blast
      # radius while still changing the outer group's output path —
      # this can.
      - name: Run per-TU rebuild-scope test
        run: PATCHED_NIX="$PWD/.patched-nix" bash tests/perf-regression.sh

      # tests/drv-equivalence.sh proves native and sandbox mode
      # produce the SAME set of drv hashes; it never builds through
      # BOTH modes in the same store, so it can't prove a drv built by
      # hand in `nix develop` is actually substituted for (not just
      # structurally equal to) the same drv in a later sandboxed `nix
      # build` — the property ARCHITECTURE.md's "Corollary: dev-shell
      # and pure-build derivations are interchangeable" names as worth
      # protecting deliberately. This hand-compiles 2 of lua's TUs via
      # `nix develop .#lua-shell`, then asserts a full `nix build
      # .#lua` reuses them instead of recompiling.
      - name: Run cross-mode reuse test
        run: PATCHED_NIX="$PWD/.patched-nix" bash tests/cross-mode-reuse.sh

  drv-equivalence:
    runs-on: ubuntu-latest
    # ONLY=hello is ~35s of build time; generous headroom for a
    # cold cache miss.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same AppArmor userns workaround as the smoke job above — see
      # its comment for why this is needed on ubuntu-latest.
      - name: Allow unprivileged user namespaces (Nix sandbox needs this on ubuntu-latest)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v15
        with:
          name: dynamicderivations
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build patched-nix
        run: nix build --no-eval-cache --accept-flake-config .#patched-nix -o .patched-nix

      # The core invariant this repo exists to prove: native and
      # sandbox mode produce byte-identical drvs. ONLY=hello keeps
      # this to the ~35s smoke of the same machinery — the full
      # 149-drv sweep (lua/fmt/mosh/gcc too) is for local/manual runs,
      # not every push.
      - name: Run drv-equivalence (hello only)
        run: PATCHED_NIX="$PWD/.patched-nix" ONLY=hello bash tests/drv-equivalence.sh

  batch-drv-equivalence:
    runs-on: ubuntu-latest
    # Both fixtures together measured ~3m15s locally on a cold cache;
    # generous headroom over that for a colder/slower CI runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same AppArmor userns workaround as the smoke job above — see
      # its comment for why this is needed on ubuntu-latest.
      - name: Allow unprivileged user namespaces (Nix sandbox needs this on ubuntu-latest)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v15
        with:
          name: dynamicderivations
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build patched-nix
        run: nix build --no-eval-cache --accept-flake-config .#patched-nix -o .patched-nix

      # The batch-archive Kind's own equivalence check (see
      # go/internal/expr/batcharchive.go's package docstring for why
      # this is separate from drv-equivalence.sh above): native and
      # sandbox modes must produce byte-identical batch-archive drvs,
      # and the resulting archive's own member list must be non-empty
      # and correctly ordered. Runs both of this script's own fixtures
      # (lua-batch: small/fast happy path; redis-batch: larger,
      # partial-match/negative-path coverage) — see the script's own
      # header comment for why both matter.
      - name: Run batch-drv-equivalence
        run: PATCHED_NIX="$PWD/.patched-nix" bash tests/batch-drv-equivalence.sh

  thin-archive-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same AppArmor userns workaround as the smoke job above — see
      # its comment for why this is needed on ubuntu-latest.
      - name: Allow unprivileged user namespaces (Nix sandbox needs this on ubuntu-latest)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v15
        with:
          name: dynamicderivations
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build patched-nix
        run: nix build --no-eval-cache --accept-flake-config .#patched-nix -o .patched-nix

      # A thin archive's (`ar csrDT`) own equivalence check — see
      # go/internal/members's package docstring for the mechanism this
      # proves: native and sandbox modes must produce byte-identical
      # drvs for a link that consumes a thin archive, and both modes'
      # resulting binary must actually run. First exercised at scale
      # by the qemu example (meson's internal static libraries all use
      # this shape); this is the minimal, dedicated reproduction.
      - name: Run thin-archive-equivalence
        run: PATCHED_NIX="$PWD/.patched-nix" bash tests/thin-archive-equivalence.sh

  kernel-boot-smoke:
    runs-on: ubuntu-latest
    # A from-scratch native-mode reference build of this exact target
    # set (vmlinux + lib/test_dhry.o, tinyconfig + serial + PVH)
    # measured 53s wall on 22 cores; sandbox mode's per-drv
    # registration overhead is the dominant unknown, plus a one-time
    # qemu substitution. Every other non-"quick" job in this file
    # already budgets 15 minutes for a comparable-or-larger fixture.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same AppArmor userns workaround as the smoke job above — see
      # its comment for why this is needed on ubuntu-latest.
      - name: Allow unprivileged user namespaces (Nix sandbox needs this on ubuntu-latest)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v15
        with:
          name: dynamicderivations
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build patched-nix
        run: nix build --no-eval-cache --accept-flake-config .#patched-nix -o .patched-nix

      # Builds examples/linux-kernel in sandbox mode, boots the plain
      # vmlinux output directly under QEMU (TCG, no KVM — GitHub-hosted
      # runners don't guarantee /dev/kvm), and asserts on the kernel's
      # own real-entry banner plus its deterministic no-rootfs panic.
      # See the script's own header comment for why this proves nixgg's
      # Kbuild output actually boots, not just that it builds.
      - name: Run kernel-boot-smoke
        run: PATCHED_NIX="$PWD/.patched-nix" bash tests/kernel-boot-smoke.sh

